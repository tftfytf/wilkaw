    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f3e8ff 0%, #e1d0f5 50%, #cbb3e8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            padding: 50px 40px;
            box-shadow: 0 25px 60px rgba(120, 80, 160, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 480px;
            width: 100%;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .profile-section {
            margin-bottom: 35px;
        }

        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(155, 124, 185, 0.4), 0 0 0 4px rgba(255, 255, 255, 0.8), 0 0 0 8px rgba(177, 156, 217, 0.3);
            position: relative;
            z-index: 2;
        }

        .avatar-container::after {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px dashed rgba(177, 156, 217, 0.6);
            animation: spin 25s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .nickname {
            font-size: 38px;
            font-weight: 800;
            color: #4a3b5c;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #7b6a8f;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 25px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            color: #4a3b5c;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(155, 124, 185, 0.1);
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 25px rgba(155, 124, 185, 0.25);
        }

        .link-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .tg-btn:hover { color: #29abe2; }
        .ig-btn:hover { color: #d6249f; }
        
        .donate-btn {
            margin-top: 10px;
            background: linear-gradient(135deg, rgba(177, 156, 217, 0.2), rgba(200, 162, 224, 0.3));
        }
        .donate-btn:hover { color: #8b6bb5; }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #9b8baa;
        }
    </style>
